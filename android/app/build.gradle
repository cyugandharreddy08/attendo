apply plugin: "com.android.application"
apply plugin: "kotlin-android"

android {
    compileSdk 34
    namespace "com.tracker75"

    defaultConfig {
        applicationId "com.tracker75"
        minSdk 24
        targetSdk 34
        versionCode 1001
        versionName "10.0.1"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (System.getenv('USE_LEGACY_SIGNING') == "true" || project.hasProperty('useLegacySigning')) {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            } else if (project.hasProperty('ATTENDO_RELEASE_STORE_FILE')) {
                storeFile file(ATTENDO_RELEASE_STORE_FILE)
                storePassword ATTENDO_RELEASE_STORE_PASSWORD
                keyAlias ATTENDO_RELEASE_KEY_ALIAS
                keyPassword ATTENDO_RELEASE_KEY_PASSWORD
            } else {
                storeFile file('attendo-release.keystore')
                storePassword 'attendo2026production'
                keyAlias 'attendo-key-alias'
                keyPassword 'attendo2026production'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
}
