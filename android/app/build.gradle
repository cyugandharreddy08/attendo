apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-android"

project.ext.react = [
    enableHermes: true,
]

react {
    /* autolinking enabled */
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tracker75"
    defaultConfig {
        applicationId "com.tracker75"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 803
        versionName "8.0.3"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('ATTENDO_RELEASE_STORE_FILE')) {
                storeFile file(ATTENDO_RELEASE_STORE_FILE)
                storePassword ATTENDO_RELEASE_STORE_PASSWORD
                keyAlias ATTENDO_RELEASE_KEY_ALIAS
                keyPassword ATTENDO_RELEASE_KEY_PASSWORD
            } else {
                storeFile file('attendo-release.keystore')
                storePassword 'attendo2026production'
                keyAlias 'attendo-key-alias'
                keyPassword 'attendo2026production'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug', 'release']
        }
        release {
            signingConfig signingConfigs.release
            matchingFallbacks = ['release', 'debug']
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
